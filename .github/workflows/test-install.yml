# Vérifie que l'installateur en une ligne fonctionne sur Mac Apple Silicon ET Intel
# (téléchargement de la dernière Release, installation, lancement de l'app).
name: Tester l'installateur

on:
  workflow_dispatch:
  workflow_call:

jobs:
  install:
    name: Installateur ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Lancer l'installateur
        run: FR_NO_OPEN=1 bash install.sh

      - name: Vérifier l'app installée
        run: |
          APP="/Applications/Fantasy Renamer.app"
          test -d "$APP"
          if xattr -r "$APP" | grep -q com.apple.quarantine; then echo "Quarantaine encore présente"; exit 1; fi
          file "$APP/Contents/MacOS/Fantasy Renamer"
          python3 -m pip install --quiet --break-system-packages Pillow 2>/dev/null || python3 -m pip install --quiet Pillow
          python3 -c "
          from PIL import Image; from pathlib import Path
          d = Path('imgs'); d.mkdir()
          for i in range(3): Image.new('RGB', (400, 300), (60*i, 90, 160)).save(d / f'img{i}.jpg')
          "
          "$APP/Contents/MacOS/Fantasy Renamer" --device
          "$APP/Contents/MacOS/Fantasy Renamer" --cli imgs out
          ls out
