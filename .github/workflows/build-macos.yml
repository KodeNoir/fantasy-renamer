# =============================================================================
#  Compilation automatique de Fantasy Renamer sur les Mac de GitHub.
#
#  - À chaque "tag" de version (ex. v1.0.0) : compile l'app pour Apple Silicon
#    ET pour Intel, teste l'IA pour de vrai, puis publie les deux ZIP dans
#    l'onglet "Releases" du dépôt.
#  - Bouton "Run workflow" (onglet Actions) : sans numéro de version = simple
#    essai (apps dans "Artifacts") ; avec un numéro (ex. v1.0.1) = publication.
# =============================================================================
name: Compiler les apps macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Numéro de version à publier (ex. v1.0.1). Laisser vide pour un simple essai."
        required: false
        default: ""

permissions:
  contents: write   # nécessaire pour créer la Release

jobs:
  build:
    name: App ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15          # Mac Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel    # Mac Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier l'architecture
        run: |
          python -c "import platform; print('Architecture Python :', platform.machine())"
          test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.arch }}"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tests de la logique (sans IA)
        run: python -m unittest discover tests -v

      - name: Cache du modèle CLIP
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: clip-vit-base-patch32-v1

      - name: Test réel de l'IA (téléchargement + classification)
        run: |
          python main.py --device
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d = Path("ci_images"); d.mkdir(exist_ok=True)
          for i in range(5):
              Image.new("RGB", (640, 480), (40 * i, 120, 200)).save(d / f"image_{i}.jpg")
          (d / "corrompue.jpg").write_bytes(b"pas une image")
          PY
          python main.py --cli ci_images ci_out_script
          ls ci_out_script

      - name: Compiler l'app (.app)
        run: bash build_app.sh

      - name: Tester l'app compilée
        run: |
          APP="dist/Fantasy Renamer-${{ matrix.arch }}.app/Contents/MacOS/Fantasy Renamer"
          "$APP" --device
          "$APP" --cli ci_images ci_out_app
          ls ci_out_app

      - name: Tester le script « 1 clic » (retrait du blocage macOS)
        run: |
          rm -rf t && mkdir t && ditto -x -k "dist/FantasyRenamer-${{ matrix.arch }}.zip" t
          echo "Contenu du ZIP :"; ls -la t
          APP="t/Fantasy Renamer.app"
          test -d "$APP"
          test -f "t/OUVREZ-MOI_D-ABORD.applescript"
          # Simule un téléchargement par navigateur : marquage de quarantaine partout
          Q="0081;00000000;Safari;"
          xattr -r -w com.apple.quarantine "$Q" "$APP" 2>/dev/null || true
          xattr -w com.apple.quarantine "$Q" "$APP"
          xattr -w com.apple.quarantine "$Q" "t/OUVREZ-MOI_D-ABORD.applescript"
          xattr -p com.apple.quarantine "$APP"
          # Exécute le script comme le ferait le bouton ▶︎ Exécuter (sans dialogues)
          FR_CI=1 osascript "t/OUVREZ-MOI_D-ABORD.applescript"
          if xattr -r "$APP" | grep -q com.apple.quarantine; then echo "❌ Quarantaine encore présente"; exit 1; fi
          echo "✅ Quarantaine retirée"
          sleep 20
          if pgrep -f "t/Fantasy Renamer.app/Contents/MacOS" >/dev/null; then echo "✅ App lancée"; else echo "❌ App non lancée"; exit 1; fi
          pkill -f "t/Fantasy Renamer.app/Contents/MacOS" || true

      - name: Mettre l'app à disposition (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: FantasyRenamer-${{ matrix.arch }}
          path: dist/FantasyRenamer-${{ matrix.arch }}.zip

  release:
    name: Publier la Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # Tag poussé (git push origin v1.0.0) ou version saisie dans "Run workflow"
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Fantasy Renamer ${{ inputs.version || github.ref_name }}
          files: zips/*.zip
          body: |
            ## Télécharger Fantasy Renamer

            | Ton Mac | Fichier à télécharger |
            |---|---|
            | Puce Apple (M1, M2, M3, M4) | **FantasyRenamer-arm64.zip** |
            | Processeur Intel | **FantasyRenamer-x86_64.zip** |

            Pour savoir quelle puce a ton Mac : menu  → **À propos de ce Mac**
            (ligne « Puce » = Apple, ligne « Processeur » = Intel).

            ### ⭐ Installation recommandée (aucun blocage de macOS)

            Ouvre l'app **Terminal** (Launchpad → Autres → Terminal), colle cette ligne et appuie sur Entrée :

            ```
            curl -fsSL https://raw.githubusercontent.com/KodeNoir/fantasy-renamer/main/install.sh | bash
            ```

            Le script choisit automatiquement la bonne version (Intel ou puce Apple), l'installe dans
            **Applications**, retire le blocage de macOS et lance l'app.

            ### Installation manuelle

            1. Télécharge le bon ZIP ci-dessous et double-clique dessus, puis glisse l'app dans **Applications**.
            2. Si macOS affiche « Apple n'a pas pu confirmer… » : clique sur **Terminé**, puis
               Réglages Système → Confidentialité et sécurité → **Ouvrir quand même**.

            Au premier traitement, le modèle d'IA (≈ 600 Mo) se télécharge une seule fois.

  test-install:
    name: Tester l'installateur
    needs: release
    uses: ./.github/workflows/test-install.yml
